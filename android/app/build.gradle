plugins {
    id 'com.android.application'
}

def googleServicesConfigured = [
    'google-services.json',
    'src/debug/google-services.json',
    'src/release/google-services.json'
].any { file(it).exists() }

if (googleServicesConfigured) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.codexswitch.terminal'
    compileSdk 36
    // Version de build-tools reellement installee sur ce poste (evite qu'AGP
    // tente de telecharger une autre version via un sdkmanager absent).
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.codexswitch.terminal"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-wallet:20.0.0'
}
