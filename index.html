<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex Terminal" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html,body,#app{width:100%;height:100%;margin:0}body{background:#000;color:#e8e1d2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.boot-splash{display:grid;min-height:100%;place-items:center;background:#000}.boot-splash span{width:24px;height:24px;border:2px solid #333;border-top-color:#d2ae4f;border-radius:50%;animation:boot-spin .8s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-splash span{animation:none}}
    </style>
    <title>Codex Terminal</title>
  </head>
  <body>
    <div id="app"><main class="boot-splash" aria-label="Chargement"><span aria-hidden="true"></span></main></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
