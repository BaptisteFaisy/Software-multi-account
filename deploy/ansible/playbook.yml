---
- name: Deployer le runtime Codex Switch Terminal
  hosts: cst_nodes
  become: true
  gather_facts: true

  vars:
    # Memoire laissee a l'hote (dockerd, containerd, tailscaled, sshd, systemd) :
    # 20 % de la RAM, avec un plancher de 1 Go. Sur la VM 8 Go cela reserve
    # ~1,6 Go alors que ces services consomment ~0,8 Go au repos.
    cst_host_memory_reserve_mb: >-
      {{ [1024, (ansible_memtotal_mb | int * 0.2) | round | int] | max }}
    # Plafond du conteneur applique par compose.yaml.j2. Surchargeable via
    # --extra-vars si un noeud a un profil different.
    cst_memory_limit_mb: >-
      {{ [1024, (ansible_memtotal_mb | int) - (cst_host_memory_reserve_mb | int)] | max }}

  pre_tasks:
    - name: Valider la plateforme cible
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_architecture in ["x86_64", "aarch64"]
          - cst_remote_port | int >= 1
          - cst_remote_port | int <= 65535
          - cst_capacity | int >= 1
          - cst_memory_limit_mb | int >= 1024
          - cst_memory_limit_mb | int < (ansible_memtotal_mb | int)
        fail_msg: >-
          Le deploiement portable cible Ubuntu ou Debian en amd64/arm64 avec
          un port et une capacite valides.

    - name: Lire l'architecture des paquets Debian
      ansible.builtin.command: dpkg --print-architecture
      register: docker_dpkg_arch
      changed_when: false

  tasks:
    - name: Installer les prerequis du depot Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Creer le dossier des cles APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Installer la cle officielle Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Configurer le depot officiel Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Installer Docker Engine et Compose
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Activer Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Valider la machine GPU demandee
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: >-
          La transcription CUDA integree exige actuellement un VPS Linux x86_64.
      when: cst_gpu_transcription | default(false) | bool

    - name: Verifier le pilote NVIDIA du VPS
      ansible.builtin.command: nvidia-smi
      changed_when: false
      when: cst_gpu_transcription | default(false) | bool

    - name: Installer la cle du NVIDIA Container Toolkit
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        owner: root
        group: root
        mode: "0644"
        force: true
      when: cst_gpu_transcription | default(false) | bool

    - name: Configurer le depot NVIDIA Container Toolkit
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/{{ docker_dpkg_arch.stdout }} /
        filename: nvidia-container-toolkit
        state: present
        update_cache: true
      when: cst_gpu_transcription | default(false) | bool

    - name: Installer le NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
      when: cst_gpu_transcription | default(false) | bool

    - name: Declarer le runtime NVIDIA dans Docker
      ansible.builtin.command:
        argv: [nvidia-ctk, runtime, configure, --runtime=docker]
      register: cst_nvidia_runtime
      changed_when: >-
        'Wrote updated config' in cst_nvidia_runtime.stdout
        or 'Wrote updated config' in cst_nvidia_runtime.stderr
      when: cst_gpu_transcription | default(false) | bool

    - name: Redemarrer Docker avec le runtime NVIDIA
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      when: cst_gpu_transcription | default(false) | bool

    - name: Tester CUDA depuis un conteneur
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --gpus
          - all
          - nvidia/cuda:12.6.3-base-ubuntu24.04
          - nvidia-smi
      changed_when: false
      when: cst_gpu_transcription | default(false) | bool

    - name: Creer les dossiers persistants
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/codex-switch-terminal, owner: root, group: root, mode: "0755" }
        - { path: /etc/codex-switch-terminal, owner: root, group: root, mode: "0700" }
        - { path: /srv/cst, owner: "10001", group: "10001", mode: "0700" }
        - { path: /srv/cst/workspaces, owner: "10001", group: "10001", mode: "0700" }

    - name: Choisir l'image effective
      ansible.builtin.set_fact:
        cst_effective_image: >-
          {{ cst_image if (cst_image | default('') | length > 0)
             else 'codex-switch-terminal:' ~ cst_release }}

    - name: Verifier si l'image construite existe deja
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ cst_effective_image }}"]
      register: cst_local_image
      changed_when: false
      failed_when: false
      when: cst_build_on_vps | bool

    - name: Transferer le contexte de build
      ansible.builtin.copy:
        src: "{{ cst_build_context_archive }}"
        dest: "/var/tmp/cst-build-{{ cst_release }}.tar.gz"
        owner: root
        group: root
        mode: "0600"
      when:
        - cst_build_on_vps | bool
        - cst_local_image.rc | default(1) != 0

    - name: Reinitialiser le contexte de build distant
      ansible.builtin.file:
        path: "/opt/codex-switch-terminal/build-{{ cst_release }}"
        state: absent
      when:
        - cst_build_on_vps | bool
        - cst_local_image.rc | default(1) != 0

    - name: Creer le contexte de build distant
      ansible.builtin.file:
        path: "/opt/codex-switch-terminal/build-{{ cst_release }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - cst_build_on_vps | bool
        - cst_local_image.rc | default(1) != 0

    - name: Extraire le contexte de build distant
      ansible.builtin.unarchive:
        src: "/var/tmp/cst-build-{{ cst_release }}.tar.gz"
        dest: "/opt/codex-switch-terminal/build-{{ cst_release }}"
        remote_src: true
      when:
        - cst_build_on_vps | bool
        - cst_local_image.rc | default(1) != 0

    - name: Construire l'image sur le VPS pour le premier deploiement
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --pull
          - --build-arg
          - "CST_GIT_COMMIT={{ cst_commit }}"
          - --tag
          - "{{ cst_effective_image }}"
          - "/opt/codex-switch-terminal/build-{{ cst_release }}"
      when:
        - cst_build_on_vps | bool
        - cst_local_image.rc | default(1) != 0

    - name: Se connecter au registre prive
      ansible.builtin.command:
        argv:
          - docker
          - login
          - "{{ cst_registry }}"
          - --username
          - "{{ cst_registry_username }}"
          - --password-stdin
        stdin: "{{ cst_registry_token }}"
        stdin_add_newline: true
      no_log: true
      when:
        - not (cst_build_on_vps | bool)
        - cst_registry_token | default('') | length > 0

    - name: Recuperer l'image preconstruite
      ansible.builtin.command:
        argv: [docker, pull, "{{ cst_effective_image }}"]
      register: cst_pull
      changed_when: "'Downloaded newer image' in cst_pull.stdout"
      when: not (cst_build_on_vps | bool)

    - name: Verifier si les comptes sont deja initialises
      ansible.builtin.stat:
        path: /srv/cst/settings.json
      register: cst_existing_settings

    - name: Transferer le seed des comptes
      ansible.builtin.copy:
        src: "{{ cst_data_seed_archive }}"
        dest: /var/tmp/cst-data-seed.tar.gz
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when:
        - cst_seed_accounts | bool
        - not cst_existing_settings.stat.exists

    - name: Initialiser les comptes sans remplacer l'etat existant
      ansible.builtin.unarchive:
        src: /var/tmp/cst-data-seed.tar.gz
        dest: /srv/cst
        remote_src: true
      no_log: true
      when:
        - cst_seed_accounts | bool
        - not cst_existing_settings.stat.exists

    - name: Verifier si le workspace du projet existe
      ansible.builtin.stat:
        path: "/srv/cst/workspaces/{{ cst_workspace_name }}/.cst-workspace-seed"
      register: cst_existing_workspace

    - name: Creer le workspace du projet
      ansible.builtin.file:
        path: "/srv/cst/workspaces/{{ cst_workspace_name }}"
        state: directory
        # L'image execute le runtime avec l'utilisateur cst (UID/GID 10001).
        # Conserver root:root en 0700 fait echouer Command::spawn avec EACCES.
        owner: "10001"
        group: "10001"
        mode: "0700"
      when: cst_seed_workspace | bool

    - name: Transferer le workspace initial
      ansible.builtin.copy:
        src: "{{ cst_workspace_seed_archive }}"
        dest: /var/tmp/cst-workspace-seed.tar.gz
        owner: root
        group: root
        mode: "0600"
      when:
        - cst_seed_workspace | bool
        - not cst_existing_workspace.stat.exists

    - name: Extraire le workspace initial sans ecraser les deploiements suivants
      ansible.builtin.unarchive:
        src: /var/tmp/cst-workspace-seed.tar.gz
        dest: "/srv/cst/workspaces/{{ cst_workspace_name }}"
        remote_src: true
      when:
        - cst_seed_workspace | bool
        - not cst_existing_workspace.stat.exists

    - name: Marquer le workspace initialise
      ansible.builtin.file:
        path: "/srv/cst/workspaces/{{ cst_workspace_name }}/.cst-workspace-seed"
        state: touch
        owner: root
        group: root
        mode: "0600"
      when:
        - cst_seed_workspace | bool
        - not cst_existing_workspace.stat.exists

    - name: Installer la configuration secrete du runtime
      ansible.builtin.template:
        src: templates/cst.env.j2
        dest: /etc/codex-switch-terminal/cst.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Installer la pile Compose
      ansible.builtin.template:
        src: templates/compose.yaml.j2
        dest: /opt/codex-switch-terminal/compose.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Demarrer ou mettre a jour le runtime
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - /opt/codex-switch-terminal/compose.yaml
          - up
          - --detach
          - --remove-orphans
          - --wait
          - --wait-timeout
          - "180"
      register: cst_compose_up
      changed_when: >-
        'Created' in cst_compose_up.stderr or
        'Recreated' in cst_compose_up.stderr or
        'Started' in cst_compose_up.stderr

    - name: Valider la sonde locale du runtime
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ cst_remote_port }}/healthz"
        method: GET
        status_code: 200
        return_content: true
      register: cst_health
      retries: 20
      delay: 3
      until: cst_health.status == 200 and (cst_health.json.ok | default(false))

    # La sonde ci-dessus a valide la nouvelle image : on peut purger sans risque.
    # Sans cette retention, chaque deploiement empilait une image ~3,9 Go et le
    # disque (48 Go) saturait en deux deploiements, faisant echouer le build
    # suivant sur « No space left on device » avant meme la compilation.
    - name: Purger les anciennes images du runtime en gardant les deux plus recentes
      ansible.builtin.shell:
        # `docker images` liste du plus recent au plus ancien. On dedoublonne les
        # IDs (plusieurs tags -> meme ID), on garde les deux premiers — dont
        # l'image qui vient d'etre validee et qui tourne — et on supprime le
        # reste. `docker rmi` refuse de toucher une image utilisee par un
        # conteneur, donc l'image en service est protegee meme en cas de course.
        cmd: |
          set -o pipefail
          keep="$(docker images codex-switch-terminal --format '{{ '{{' }}.ID{{ '}}' }}' | awk '!seen[$0]++' | head -2)"
          docker images codex-switch-terminal --format '{{ '{{' }}.ID{{ '}}' }}' | awk '!seen[$0]++' | tail -n +3 | while read -r id; do
            docker rmi "$id" >/dev/null 2>&1 || true
          done
          echo "gardees: $(echo "$keep" | tr '\n' ' ')"
      args:
        executable: /bin/bash
      register: cst_image_retention
      changed_when: false

    - name: Recuperer le cache de build orphelin
      # `builder prune` sans `--all` ne touche pas le cache encore reference par
      # le graphe de build (le cache Cargo reste chaud pour le prochain build) ;
      # il ne recupere que les couches devenues orphelines.
      ansible.builtin.command:
        argv: [docker, builder, prune, --force]
      register: cst_builder_prune
      changed_when: "'Total reclaimed space: 0B' not in cst_builder_prune.stdout"

    - name: Supprimer les archives temporaires sensibles
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/tmp/cst-data-seed.tar.gz
        - /var/tmp/cst-workspace-seed.tar.gz
        - "/var/tmp/cst-build-{{ cst_release }}.tar.gz"

    - name: Afficher le resultat sans secret
      ansible.builtin.debug:
        msg: >-
          {{ cst_node_label }} est operationnel sur 127.0.0.1:{{ cst_remote_port }}
          avec l'image {{ cst_effective_image }}.
