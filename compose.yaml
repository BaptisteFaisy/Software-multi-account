name: codex-switch-terminal

services:
  cst:
    image: ${CST_IMAGE:-codex-switch-terminal:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CST_GIT_COMMIT: ${CST_GIT_COMMIT:-local}
    restart: unless-stopped
    init: true
    env_file:
      - ${CST_ENV_FILE:-deploy/cst-container.env}
    ports:
      - "127.0.0.1:${CST_HOST_PORT:-8080}:8080"
    volumes:
      - ${CST_DATA_PATH:-./.cst-data}:/srv/cst
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 8
